name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The HLS diagnostics subsystem (~9.7k lines across Sources/PlayerKit/PlaybackHealth,
  # the HLSPlayback* views, and 5 of the 7 test files) is `#if os(macOS)`. The iOS
  # job below compiles none of it and runs none of its ~86 tests, so without this
  # job a change that breaks that half of the package merges green.
  macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (macOS)
        run: swift build

      - name: Test (macOS)
        run: swift test

  validate:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Package Manifest
        run: swift package describe

      - name: Verify Binary Target Artifacts
        run: ./scripts/verify_binary_targets.sh

      - name: Verify Third-Party Notices
        run: ./scripts/verify_third_party_notices.sh

      - name: Build for iOS Simulator
        run: xcodebuild -scheme PlayerKit -destination 'generic/platform=iOS Simulator' build -quiet

      - name: Run Unit Tests (iOS Simulator)
        run: ./scripts/run_unit_tests.sh

      - name: Build for iOS Device
        run: xcodebuild -scheme PlayerKit -destination 'generic/platform=iOS' build -quiet
